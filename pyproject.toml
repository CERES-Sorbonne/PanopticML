[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "version.py"

[project]
name = "panopticml"
dynamic = ["version"]
authors = [
  { name="Félix Alié", email="felix.alie@sorbonne-universite.fr" },
]
description = "A package for Panoptic ML"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "torch",
    "torchvision",
    "transformers>=5.19",
    "accelerate",  # needed by transformers for device_map
    "faiss-cpu<1.11.0",
    "scikit-learn",
    "scipy",
    "numpy",
    "fast_hdbscan",
    "umap-learn",
    "pacmap",
    "timm",  # C-RADIO, MobileCLIP
    "einops",  # C-RADIO
    "open-clip-torch",  # MobileCLIP
    # Apple Silicon compute engines, see compute/accel; without them PyTorch computes alone.
    # coremltools ships no Python 3.14 wheel, MLX none before macOS 14 (Darwin 23): skipped
    # there, a source build would fail the whole install.
    "coremltools; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version < '3.14'",
    "mlx; sys_platform == 'darwin' and platform_machine == 'arm64' and '20.' not in platform_release and '21.' not in platform_release and '22.' not in platform_release",
]


[project.urls]
"Homepage" = "https://github.com/CERES-Sorbonne/PanopticML"
"Bug Tracker" = "https://github.com/CERES-Sorbonne/PanopticML/issues"

[tool.hatch.build.targets.wheel]
# This configuration ensures that the 'panopticml' directory is treated as the package.
# When installed, the package can be imported using 'import panopticml'.
packages = ["panopticml"]
